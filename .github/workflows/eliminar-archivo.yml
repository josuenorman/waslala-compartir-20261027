name: Retirar archivo compartido a los 10 dias

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retirar-archivo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Eliminar solamente el RAR si cumplio diez dias
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'compartir-waslala';
            const nombre = 'Waslala_Ligero.rar';
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                ...context.repo, tag
              })).data;
            } catch (error) {
              if (error.status === 404) {
                core.info('La release aun no existe o ya fue retirada.');
                return;
              }
              throw error;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            for (const asset of assets) {
              if (asset.name !== nombre || asset.state !== 'uploaded') continue;
              const vencimiento = new Date(asset.created_at).getTime() + 10 * 24 * 60 * 60 * 1000;
              if (!Number.isFinite(vencimiento)) throw new Error('Fecha de archivo no valida');
              if (Date.now() < vencimiento) {
                core.info(`Disponible hasta ${new Date(vencimiento).toISOString()}.`);
                continue;
              }
              await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
              core.notice(`Eliminado ${asset.name}: cumplio diez dias desde la subida.`);
            }
